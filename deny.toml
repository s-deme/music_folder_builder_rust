# cargo-deny 0.20.2 configuration. Keep the tool version pinned in CI.

[graph]
all-features = true

[advisories]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Workspace manifests currently omit `license.workspace = true`. Bind each crate
# to the repository MIT text without weakening third-party license validation.
[[licenses.clarify]]
crate = "music-folder-cli"
expression = "MIT"
license-files = [{ path = "../../LICENSE", hash = 0xdcd7afd6 }]

[[licenses.clarify]]
crate = "music-folder-core"
expression = "MIT"
license-files = [{ path = "../../LICENSE", hash = 0xdcd7afd6 }]

[[licenses.clarify]]
crate = "music-folder-desktop"
expression = "MIT"
license-files = [{ path = "../../LICENSE", hash = 0xdcd7afd6 }]

[[licenses.clarify]]
crate = "music-folder-infra"
expression = "MIT"
license-files = [{ path = "../../LICENSE", hash = 0xdcd7afd6 }]

[bans]
multiple-versions = "warn"
# Existing workspace path dependencies have no version field and are reported as
# wildcards by cargo-deny. Keep them visible without rejecting the local graph.
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
