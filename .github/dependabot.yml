version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    labels:
      - dependencies
      - ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      rust:
        patterns: ["*"]
    labels:
      - dependencies
      - rust
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      ui:
        patterns: ["*"]
    labels:
      - dependencies
      - ui
